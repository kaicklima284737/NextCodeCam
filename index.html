async function pdfF(){const l=vis().filter(i=>i.folder==F.f&&(!F.s||i.sub==F.s));if(!l.length)return;try{busy(1);await need('jspdf','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const d=new jspdf.jsPDF();let first=1;for(const i of l.slice().reverse()){const im=await load(i.img);if(!first)d.addPage();first=0;d.setFontSize(14);d.text(S(i.title,60),10,12);d.addImage(i.img,'JPEG',10,18,190,Math.min(190*im.naturalHeight/im.naturalWidth,260));if(i.text){d.addPage();d.setFontSize(10);d.text(d.splitTextToSize(i.text,190).slice(0,60),10,12)}}d.save(F.f+'.pdf')}catch(x){t(x.message)}busy(0)}

async function pdf(id){const i=it(id);try{busy(1);await need('jspdf','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const d=new jspdf.jsPDF(),im=await load(i.img);d.text(i.title,10,12);d.addImage(i.img,'JPEG',10,18,190,Math.min(190*im.naturalHeight/im.naturalWidth,260));if(i.text){d.addPage();d.setFontSize(10);d.text(d.splitTextToSize(i.text,190).slice(0,60),10,12)}d.save(i.title+'.pdf')}catch(e){t(e.message)}busy(0)}

const i=it(QZ.id),n=Object.keys(QZ.a).length,ok=i.quiz.filter((q,k)=>QZ.a[k]==q.a).length;if(n==i.quiz.length&&!QZ.sv){QZ.sv=1;i.qs=ok+'/'+n;touch(i);sv2()}
$('#v-quiz').innerHTML=hd('Quiz de Fixação',E(i.title),'QZ=null;rQuiz()')+i.quiz.map((q,k)=>`<div class="qz"><small>Questão ${k+1} de ${i.quiz.length}</small><p>${E(q.q)}</p>${q.o.map((o,j)=>{const a=QZ.a[k],c=a==null?'':j==q.a?'ok':j==a?'bad':'';return`<button class="op ${c}" onclick="pick(${k},${j})"><b>${'ABCD'[j]}</b>${E(o)}</button>`}).join('')}${QZ.a[k]!=null?`<small>${E(q.e)}</small>`:''}</div>`).join('')+(n==i.quiz.length?`<div class="card"><b>Resultado: ${ok} de ${n} acertos</b></div><button class="b y" style="width:100%" onclick="QZ={id:QZ.id,a:{}};rQuiz()">Refazer</button>`:'')}

async function gGet(k){const v=window.GD&&Object.hasOwn(window.GD,k)?window.GD[k]:null;if(!okId(k)||!v||!okImg(v.thumb))return t('Item inválido');items.unshift({...clean(v,k,v.thumb),date:Date.now(),up:Date.now(),sy:0});await sv2();t('Importado para '+S(v.folder,60));gList()}

<h3>Organização inteligente</h3><div class="card">${tg('ai','IA automática','Lê o texto da foto e sugere título e pasta')}${tg('org','Pastas automáticas por conteúdo','Usa pasta parecida ou cria uma nova (ex.: Física)')}${tg('sub','Subpastas pelo tema','Ex.: Física › Óptica')}${tg('auto','Salvar sem revisar','Salva assim que a análise terminar')}${tg('rev','Abrir revisão após cada foto','Desligado: fotos vão para a fila e você revisa depois')}${tg('hq','Foto em alta resolução','Usa a câmera completa do aparelho')}${tg('img','Enviar foto à IA','Desligado: só o texto lido no aparelho vai à IA')}${tg('autopdf','PDF automático de documentos','Baixa o PDF ao salvar no modo Documento')}${tg('aula','Modo Aula pela grade','Marca a disciplina do horário atual')}

<h3>Privacidade e seus dados</h3><div class="card"><small>Fotos e textos ficam no aparelho. Com conta, uma cópia reduzida vai ao seu espaço privado no Firebase. Com IA ligada, a foto (ou só o texto, se "Enviar foto à IA" estiver desligado) vai ao Google Gemini. Rostos podem aparecer nas fotos: peça permissão antes de fotografar pessoas. Grupos mostram o que você enviar a quem tem o código.</small><button class="b d" style="width:100%;margin-top:10px" onclick="wipe()">Apagar meus dados e conta</button></div>
<h3>Como deixar 100% funcional</h3>
<details><summary>1 · Publicar com HTTPS</summary><p>A câmera só funciona em HTTPS ou localhost. Publique o projeto na Vercel. No celular, abra o link e use "Adicionar à tela inicial".</p></details>
<details><summary>2 · IA gratuita</summary><p>Crie uma chave em aistudio.google.com/apikey (plano gratuito do Gemini) e cole em IA. Uma única chamada lê a imagem (OCR), sugere título, matéria e tema. Resumo, quiz e flashcards usam o texto extraído. Sem chave, o app usa Tesseract.js (OCR local), mas sem resumo, quiz ou classificação.</p></details>
<details><summary>3 · Grupo entre aparelhos</summary><p>No console.firebase.google.com crie um projeto › Realtime Database › modo teste. Copie a URL, cole acima, crie um grupo e passe o código aos colegas. Envie itens pelo botão "Enviar ao grupo" e importe na lista.</p></details>
<details><summary>4 · Para produção</summary><p>Guarde a chave de IA em um backend (proxy), use Firebase Auth para login Google real e regras de segurança no banco. Empacote com Capacitor para virar app nativo e acessar sensores extras.</p></details>`;gList()}
function rCtl(){const p=$('#ctl');if(!p.hidden){p.hidden=true;return}TR=stream?.getVideoTracks()[0];const c=TR?.getCapabilities?.()||{},g=TR?.getSettings?.()||{},sl=(k,l)=>c[k]&&c[k].max!=null?`<label>${l}</label><input type="range" min="${c[k].min}" max="${c[k].max}" step="${c[k].step||1}" value="${g[k]??c[k].min}" oninput="setC('${k}',+this.value)">`:'';p.innerHTML=(sl('focusDistance','Foco')+sl('iso','ISO')+sl('exposureCompensation','Brilho')+sl('zoom','Zoom')||'<small>Este aparelho não permite ajuste manual pelo navegador.</small>')+`<button class="b y" style="width:100%;margin-top:10px" onclick="autoC()">Reativar IA automática</button>`;p.hidden=false}
