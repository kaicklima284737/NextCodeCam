async function pdf(id){const i=it(id);try{busy(1);await need('jspdf','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');const d=new jspdf.jsPDF(),im=await load(i.img);d.text(i.title,10,12);d.addImage(i.img,'JPEG',10,18,190,Math.min(190*im.naturalHeight/im.naturalWidth,260));if(i.text){d.addPage();d.setFontSize(10);d.text(d.splitTextToSize(i.text,190).slice(0,60),10,12)}d.save(i.title+'.pdf')}catch(e){t(e.message)}busy(0)}
/* quiz */
async function openQ(id){const i=it(id);if(!i.quiz){await act(id,'quiz')}if(i.quiz){QZ={id,a:{}};go('quiz')}}
function pick(q,o){if(QZ.a[q]==null){QZ.a[q]=o;rQuiz()}}
function rQuiz(){if(!QZ){$('#v-quiz').innerHTML=hd('Quizzes','Teste seus conhecimentos e evolua!')+(items.map(i=>`<div class="it" onclick="openQ('${i.id}')"><img src="${i.img}" alt=""><div><b>${E(i.title)}</b><small>${E(i.folder)}</small><span class="tag">${i.quiz?i.quiz.length+' questões':'Gerar quiz com IA'}</span></div></div>`).join('')||'<div class="card">Capture uma aula para gerar seu primeiro quiz.</div>');return}
const i=it(QZ.id),n=Object.keys(QZ.a).length,ok=i.quiz.filter((q,k)=>QZ.a[k]==q.a).length;
$('#v-quiz').innerHTML=hd('Quiz de Fixação',E(i.title),'QZ=null;rQuiz()')+i.quiz.map((q,k)=>`<div class="qz"><small>Questão ${k+1} de ${i.quiz.length}</small><p>${E(q.q)}</p>${q.o.map((o,j)=>{const a=QZ.a[k],c=a==null?'':j==q.a?'ok':j==a?'bad':'';return`<button class="op ${c}" onclick="pick(${k},${j})"><b>${'ABCD'[j]}</b>${E(o)}</button>`}).join('')}${QZ.a[k]!=null?`<small>${E(q.e)}</small>`:''}</div>`).join('')+(n==i.quiz.length?`<div class="card"><b>Resultado: ${ok} de ${n} acertos</b></div><button class="b y" style="width:100%" onclick="QZ={id:QZ.id,a:{}};rQuiz()">Refazer</button>`:'')}
/* grupo (Firebase Realtime Database via REST) */
const fb=()=>cfg.fb.replace(/\/$/,'')+'/groups/'+cfg.grp;
async function gSend(id){if(!cfg.fb||!cfg.grp)return t('Entre em um grupo em Mais');const i=it(id);try{busy(1);await fetch(`${fb()}/${i.id}.json`+await auth(),{method:'PUT',body:JSON.stringify({title:i.title,folder:i.folder,sub:i.sub,text:i.text,summary:i.summary||null,thumb:cv(await load(i.img),1000).toDataURL('image/jpeg',.6),by:cfg.user.name,ts:Date.now()})});t('Enviado ao grupo '+cfg.grp)}catch{t('Falha ao enviar. Verifique a URL do Firebase.')}busy(0)}
async function gList(){const e=$('#gl');if(!e||!cfg.fb||!cfg.grp)return;try{const d=await(await fetch(fb()+'.json'+await auth())).json()||{};const a=Object.entries(d).sort((x,y)=>y[1].ts-x[1].ts);e.innerHTML=a.map(([k,v])=>`<div class="it"><img src="${v.thumb}" alt=""><div><b>${E(v.title)}</b><small>${E(v.by)} · ${E(v.folder)}</small>${items.some(i=>i.id==k)?'<small>Já na sua biblioteca</small>':`<button class="tag" style="text-align:left" onclick="gGet('${k}')">Importar</button>`}</div></div>`).join('')||'<small>Nenhum item compartilhado ainda.</small>';window.GD=d}catch{e.innerHTML='<small class="er">Não foi possível ler o grupo.</small>'}}
async function gGet(k){const v=GD[k];items.unshift({id:k,img:v.thumb,title:v.title,folder:v.folder,sub:v.sub||'',text:v.text||'',summary:v.summary||undefined,date:Date.now(),from:v.by});await sv2();t('Importado para '+v.folder);gList()}
const gMake=()=>{cfg.grp=Math.random().toString(36).slice(2,7).toUpperCase();sv();rMore()};
setInterval(()=>cur=='more'&&gList(),8000);
/* mais / configurações */
const tg=(k,a,b)=>`<label class="row" style="margin:0;color:var(--tx);font-size:14px"><span>${a}<br><small>${b}</small></span><input type="checkbox" ${cfg[k]?'checked':''} onchange="cfg.${k}=this.checked;sv()"></label>`;
const fi=(k,l,ph,ty)=>`<label>${l}</label><input ${ty?'type="'+ty+'"':''} value="${E(cfg[k])}" placeholder="${ph||''}" onchange="cfg.${k}=this.value.trim();sv()">`;
function rMore(){$('#v-more').innerHTML=hd('Mais','Configurações, grupo e ajuda')+`<div class="card"><b>${E(cfg.user?.name)}</b><br><small>${E(cfg.user?.email||'Modo visitante · sem nuvem')}</small><br><small>${items.filter(i=>!i.sy).length} pendentes de sincronização</small><div class="grid" style="margin:8px 0"><button class="b" onclick="sync().then(o=>{t(o?'Sincronizado':'Sem conexão, login ou URL do Firebase');rMore()})">Sincronizar agora</button><button class="b" onclick="out()">Sair</button></div>${tg('wifi','Sincronizar só no Wi-Fi','Pausa o envio em dados móveis')}${fi('ak','Chave de API Firebase (Web)','AIza…')}${fi('gc','Client ID Google (opcional)','…apps.googleusercontent.com')}</div>
<h3>Organização inteligente</h3><div class="card">${tg('ai','IA automática','Lê o texto da foto e sugere título e pasta')}${tg('org','Pastas automáticas por conteúdo','Usa pasta parecida ou cria uma nova (ex.: Física)')}${tg('sub','Subpastas pelo tema','Ex.: Física › Óptica')}${tg('auto','Salvar sem revisar','Salva assim que a análise terminar')}${tg('aula','Modo Aula pela grade','Marca a disciplina do horário atual')}
<label>Grade de aulas (uma por linha: dia hh:mm-hh:mm Disciplina)</label><textarea rows="3" placeholder="seg 19:00-22:00 Engenharia de Software" onchange="cfg.sched=this.value;sv()">${E(cfg.sched)}</textarea>
<label>Nova pasta</label><div class="grid" style="margin:0"><input id="nf" placeholder="Ex.: Matemática"><button class="b" onclick="const n=$('#nf').value.trim();n&&!cfg.extra.includes(n)&&cfg.extra.push(n);sv();t('Pasta criada')">Criar pasta</button></div></div>
<h3>IA (gratuita)</h3><div class="card">${tg('px','IA pelo servidor','Usa a função Netlify, sem chave no aparelho')}${fi('key','Chave Gemini','Cole aqui sua chave','password')}${fi('model','Modelo','gemini-2.5-flash')}<small><br><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--y)">Gerar chave gratuita no Google AI Studio</a></small></div>

<h3>Grupo de estudo</h3><div class="card">${fi('fb','URL do Firebase Realtime Database','https://SEU-PROJETO-default-rtdb.firebaseio.com')}<label>Código do grupo</label><div class="grid" style="margin:0"><input id="gc" value="${E(cfg.grp)}" placeholder="Ex.: K7Q2A" style="text-transform:uppercase"><button class="b" onclick="cfg.grp=$('#gc').value.trim().toUpperCase();sv();gList();t('Grupo '+cfg.grp)">Entrar</button></div><button class="b" style="width:100%;margin-top:8px" onclick="gMake()">Criar novo grupo</button></div><div id="gl"></div>
<h3>Como deixar 100% funcional</h3>
<details><summary>1 · Publicar com HTTPS</summary><p>A câmera só funciona em HTTPS ou localhost. Arraste este arquivo para netlify.com/drop, ou use GitHub Pages/Vercel. No celular, abra o link e use "Adicionar à tela inicial".</p></details>
<details><summary>2 · IA gratuita</summary><p>Crie uma chave em aistudio.google.com/apikey (plano gratuito do Gemini) e cole em IA. Uma única chamada lê a imagem (OCR), sugere título, matéria e tema. Resumo, quiz e flashcards usam o texto extraído. Sem chave, o app usa Tesseract.js (OCR local), mas sem resumo, quiz ou classificação.</p></details>
<details><summary>3 · Grupo entre aparelhos</summary><p>No console.firebase.google.com crie um projeto › Realtime Database › modo teste. Copie a URL, cole acima, crie um grupo e passe o código aos colegas. Envie itens pelo botão "Enviar ao grupo" e importe na lista.</p></details>
<details><summary>4 · Para produção</summary><p>Guarde a chave de IA em um backend (proxy), use Firebase Auth para login Google real e regras de segurança no banco. Empacote com Capacitor para virar app nativo e acessar sensores extras.</p></details>`;gList()}
